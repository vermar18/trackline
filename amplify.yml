version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 24
        - nvm use 24
        - npm ci --include=dev
    build:
      commands:
        - npm run build
        - node build-amplify.mjs
        - npm ci --omit=dev --omit=peer --omit=optional --ignore-scripts --prefix .amplify-hosting/compute/default
  artifacts:
    baseDirectory: .amplify-hosting
    files:
      - '**/*'
